<script>
const X={en:{home:'Home',service:'Service',how:'How it works',trackNav:'Track',contact:'Contact',admin:'Admin',trackEyebrow:'TRACK REQUEST',trackTitle:'Check your request status',trackText:'Enter your request reference to view its latest status on this device.',referenceLabel:'Request reference',trackButton:'Track request',backHome:'Back to website',notFound:'No request found with this reference.',statusLabel:'Status',createdLabel:'Created',current:'Current region',destination:'Destination region',player:'Player ID',paymentLabel:'Payment'},fr:{home:'Accueil',service:'Service',how:'Fonctionnement',trackNav:'Suivre',contact:'Contact',admin:'Admin',trackEyebrow:'SUIVRE LA DEMANDE',trackTitle:'Vérifiez le statut de votre demande',trackText:'Entrez votre référence pour voir le dernier statut sur cet appareil.',referenceLabel:'Référence de la demande',trackButton:'Suivre la demande',backHome:'Retour au site',notFound:'Aucune demande trouvée avec cette référence.',statusLabel:'Statut',createdLabel:'Créée le',current:'Région actuelle',destination:'Région de destination',player:'ID joueur',paymentLabel:'Paiement'} ,pt:{home:'Início',service:'Serviço',how:'Como funciona',trackNav:'Acompanhar',contact:'Contato',admin:'Admin',trackEyebrow:'ACOMPANHAR SOLICITAÇÃO',trackTitle:'Verifique o status da solicitação',trackText:'Digite a referência para ver o status mais recente neste dispositivo.',referenceLabel:'Referência da solicitação',trackButton:'Acompanhar solicitação',backHome:'Voltar ao site',notFound:'Nenhuma solicitação encontrada com esta referência.',statusLabel:'Status',createdLabel:'Criada em',current:'Região atual',destination:'Região de destino',player:'ID do jogador',paymentLabel:'Pagamento'},es:{home:'Inicio',service:'Servicio',how:'Cómo funciona',trackNav:'Seguimiento',contact:'Contacto',admin:'Admin',trackEyebrow:'SEGUIMIENTO',trackTitle:'Consulta el estado de tu solicitud',trackText:'Introduce la referencia para ver el último estado guardado en este dispositivo.', function langApply(l){const t=X[l]||X.en;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>{if(t[e.dataset.i18n])e.textContent=t[e.dataset.i18n]});localStorage.setItem('siteLang',l)}
const sel=document.getElementById('language');sel.value=localStorage.getItem('siteLang')||'en';sel.addEventListener('change',e=>langApply(e.target.value));langApply(sel.value);document.getElementById('menu').addEventListener('click',()=>document.querySelector('.header').classList.toggle('open'));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function getSupabaseKey(){const txt=await fetch('visitors.js').then(r=>r.text());const m=txt.match(/anonKey\s*=\s*"([^"]+)"/);if(!m)throw Error('Tracking service unavailable');return m[1]}
async function show(){const l=localStorage.getItem('siteLang')||'en',t=X[l]||X.en,k=document.getElementById('ref').value.trim().toUpperCase(),out=document.getElementById('result');if(!k){out.className='result show';out.innerHTML='<div class="not-found" style="grid-column:1/-1">'+t.notFound+'</div>';return}let r=null;try{const key=await getSupabaseKey();const res=await fetch('https://ezooggzcdybssxsukkxn.supabase.co/rest/v1/requests?reference=eq.'+encodeURIComponent(k)+'&select=reference,current_region,destination_region,player_id,email,status,payment_method,payment_status,created_at',{headers:{apikey:key,Authorization:'Bearer '+key}});if(res.ok){const rows=await res.json();r=Array.isArray(rows)&&rows[0]?rows[0]:null}}catch{}if(!r){let list=[];try{const parsed=JSON.parse(localStorage.getItem('requests')||'[]');list=Array.isArray(parsed)?parsed:[]}catch{}r=list.find(x=>String(x?.ref||'').toUpperCase()===k)||null}if(!r){out.className='result show';out.innerHTML='<div class="not-found" style="grid-column:1/-1">'+t.notFound+'</div>';return}let d='';try{d=new Date(r.created_at||r.created).toLocaleString(l,{dateStyle:'medium',timeStyle:'short'})}catch{d=r.created_at||r.created||''}out.className='result show';out.innerHTML='<div><small>'+t.statusLabel+'</small><strong>'+esc(r.status||'Received')+'</strong></div><div><small>'+t.createdLabel+'</small><strong>'+esc(d)+'</strong></div><div><small>'+t.current+'</small><strong>'+esc(r.current_region||r.current)+'</strong></div><div><small>'+t.destination+'</small><strong>'+esc(r.destination_region||r.destination)+'</strong></div><div><small>'+t.player+'</small><strong>'+esc(r.player_id||r.player)+'</strong></div><div><small>'+t.paymentLabel+'</small><strong>'+esc(r.payment_method||r.paymentMethod||'—')+'</strong></div>}document.getElementById('btn').addEventListener('click',()=>show().catch(()=>{}));document.getElementById('ref').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();show()}});const q=new URLSearchParams(location.search).get('ref');if(q){document.getElementById('ref').value=q;show().catch(()=>{})}
</script>

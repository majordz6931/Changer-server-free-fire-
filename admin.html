<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#07080c"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Free Fire Server Change</title><link rel="stylesheet" href="admin-v2.css"><link rel="icon" href="site-logo.jpg"></head>
<body><main class="login" id="login"><div class="box"><div class="admin-logo"><span class="brand-mark">⚡</span><div><h1>Admin Dashboard</h1><p class="admin-sub">FREE FIRE SERVER CHANGE</p></div></div><p>Manage and review all customer requests.</p><input id="user" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Sign in</button><small id="err"></small></div></main>
<main class="dash hidden" id="dash"><header><div><b>FREE FIRE SERVER CHANGE</b><span>Admin Dashboard</span></div><div><a href="index.html">Open website</a><button id="refresh">Refresh</button><button id="logout">Log out</button></div></header>
<section class="cards"><div><b id="count">0</b><span>Total requests</span></div><div><b id="pending">0</b><span>Pending review</span></div><div><b id="paid">0</b><span>Payment selected</span></div></section>
<section class="panel"><div class="panel-head"><h2>All requests</h2><div><select id="filter"><option value="all">All</option><option value="Pending">Pending</option><option value="Approved">Approved</option><option value="Completed">Completed</option><option value="Rejected">Rejected</option></select><button id="clear">Clear all</button></div></div><div id="requests"></div></section></main>
<script src="admin.js"></script></body></html>
